<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#FAF8F5;--paper:#FFFFFF;--ink:#1E293B;--sub:#64748B;--line:#E6EAEF;--line2:#D3DBE3;
  --sea:#4F7F97;--sea-soft:#EAF2F6;--on-sea:#FFFFFF;--hd1:#4F7F97;--hd2:#7BA9BD;
  --sand:#F1E8DC;--sand-ink:#8A6D49;--tip-bg:#FBF3E4;--tip-line:#EFDDB9;
  --warn-bg:#FBF3E4;--warn-ink:#7A5B1E;--warn-line:#EFDDB9;
  --shadow:0 1px 2px rgba(30,41,59,.05),0 4px 14px rgba(30,41,59,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#0F1A22;--paper:#16242E;--ink:#E5EDF3;--sub:#9AAFBD;--line:#24394A;--line2:#2F4658;
    --sea:#7FB0C8;--sea-soft:#1A3342;--on-sea:#0F1A22;--hd1:#24506A;--hd2:#3C6E86;
    --sand:#2D2A24;--sand-ink:#D8BE98;--tip-bg:#1D2A33;--tip-line:#2A3B47;
    --warn-bg:#3A2F17;--warn-ink:#F0CF8C;--warn-line:#5D4A21;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:520px;margin:0 auto;padding-bottom:96px}

/* header */
header{padding:30px 22px 20px;background:linear-gradient(165deg,var(--hd1) 0%,var(--hd2) 100%);color:#fff}
header h1{margin:0;font-size:23px;font-weight:700;letter-spacing:.04em}
header h1::before{content:"🌺";margin-right:8px;font-size:.9em}
header p{margin:4px 0 0;font-size:13.5px;opacity:.9;letter-spacing:.02em}
.prog{margin-top:16px;font-size:13px}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.28);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width .35s}
svg.wave{display:block;width:100%;height:22px;margin-top:-1px;color:var(--bg)}

/* tabs */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center}
nav{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--sub);border-radius:12px;padding:5px 13px;font:inherit;font-size:12.5px;text-align:center;cursor:pointer;min-width:60px;box-shadow:var(--shadow);transition:background .2s,color .2s,border-color .2s}
nav button b{display:block;font-size:15px;font-weight:600;color:var(--ink);line-height:1.35}
nav button[aria-selected="true"]{background:var(--sea);border-color:var(--sea);color:var(--on-sea);box-shadow:0 2px 8px rgba(79,127,151,.35)}
nav button[aria-selected="true"] b{color:var(--on-sea)}
nav .ck{display:none;font-style:normal;font-size:11px;margin-left:3px}
nav button.done .ck{display:inline}
nav button:focus-visible,label:focus-within,.jrow:focus-visible,.jclose:focus-visible,#jump:focus-visible,#toTop:focus-visible,.lks a:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

/* day */
.day{padding:22px 16px 0}
.day h2{margin:0;font-size:20px;font-weight:700;letter-spacing:.01em}
.day .theme{margin:2px 0 8px;color:var(--sub);font-size:13.5px}
.day .done{display:inline-block;padding:1px 10px;font-size:12px;color:var(--sea);background:var(--sea-soft);border-radius:99px;font-weight:500}
.note{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--tip-bg);border:1px solid var(--tip-line);font-size:13px}
ul{list-style:none;margin:16px 0 0;padding:0;border-left:1.5px solid var(--line2);margin-left:6px}
li{position:relative;margin:0 0 12px 18px}
li::before{content:"";position:absolute;left:-24.5px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--sea)}
li.on::before{background:var(--sea)}

/* cards */
label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);cursor:pointer}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:0 0 22px;width:22px;height:22px;margin:2px 0 0;border:1.5px solid var(--line2);border-radius:7px;background:var(--paper);display:grid;place-content:center;cursor:pointer;transition:background .15s,border-color .15s}
input[type=checkbox]::after{content:"";width:5px;height:10px;border:solid var(--on-sea);border-width:0 2.2px 2.2px 0;transform:rotate(45deg) scale(0);transition:transform .15s;margin-top:-2px}
input[type=checkbox]:checked{background:var(--sea);border-color:var(--sea)}
input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
.txt{min-width:0}
.time{display:inline-block;font-size:11.5px;font-weight:500;color:var(--sand-ink);background:var(--sand);padding:1px 9px;border-radius:99px;margin-bottom:3px;letter-spacing:.02em}
.ttl{font-weight:500;font-size:15px;line-height:1.5}
.dsc{font-size:13px;color:var(--sub);margin-top:2px}
li.on .ttl{text-decoration:line-through;text-decoration-color:var(--line2);color:var(--sub)}
.opt{margin-top:6px;font-size:13px;color:var(--sub)}.opt b{display:block;color:var(--ink);font-weight:500}
/* .tip 樣式 */
.tip{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--tip-bg);border:1px solid var(--tip-line);font-size:12.5px}
.lks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* link */
.lks a{font-size:12px;color:var(--sea);background:var(--sea-soft);border-radius:99px;padding:2px 11px;text-decoration:none;font-weight:500}
.warn{margin:8px 0 0;padding:10px 12px;border-radius:10px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);font-size:13px}
.warn b{display:block;margin-bottom:2px;font-weight:600}

/* sub checklist */
li.has-sub{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
li.has-sub>label{border:0;background:transparent;box-shadow:none}
.sub{margin:0 14px 14px 48px}
.sbody{display:grid;gap:0;margin-top:2px}
.subh{display:block;list-style:none;cursor:pointer;font-size:14px;font-weight:500;padding:4px 0}
.subh::-webkit-details-marker{display:none}
.subh::after{content:"▾";float:right;color:var(--sub);transition:transform .2s}
.sub:not([open]) .subh::after{transform:rotate(-90deg)}
.subh b{font-weight:500;font-size:11.5px;margin-left:4px;padding:1px 9px;color:var(--sand-ink);background:var(--sand);border-radius:99px}
.sl{display:flex;align-items:center;gap:10px;padding:3px 0;border:0;border-radius:0;background:transparent;box-shadow:none;font-size:13px;color:var(--sub);cursor:pointer}
.sl input{flex:0 0 19px;width:19px;height:19px;margin:0;border-radius:6px}
.sl.on span{text-decoration:line-through;text-decoration-color:var(--line2)}

/* dinner detail card */
.det{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
.det summary{padding:11px 14px;font-weight:500;font-size:13.5px;cursor:pointer;color:var(--warn-ink);background:var(--warn-bg);list-style:none}
.det summary::-webkit-details-marker{display:none}
.det summary::after{content:"＋";float:right}.det[open] summary::after{content:"－"}
.dbody{padding:12px;display:grid;gap:10px}
.dinfo{padding:10px 12px;border-radius:10px;background:var(--tip-bg);border:1px solid var(--tip-line);font-size:13px}.dinfo b{display:block;margin-bottom:2px;font-weight:600}
.plan{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.plan-h{padding:10px 12px;background:var(--sea-soft)}
.plan-h .pn{font-weight:600;font-size:14.5px}.plan-h .pp{color:var(--sea);font-weight:600;font-size:13.5px}.plan-h .pf{font-size:12px;color:var(--sub);margin-top:1px}
.prow{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:7px 12px;border-top:1px solid var(--line);font-size:13px}
.prow span:first-child{color:var(--sub)}

/* floating buttons */
#jump,#toTop{position:fixed;right:16px;z-index:15;width:44px;height:44px;padding:0;border-radius:50%;display:grid;place-content:center;cursor:pointer}
#jump{bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--paper);color:var(--sea);border:1px solid var(--line2);box-shadow:0 4px 16px rgba(30,41,59,.16)}
#toTop{bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--sea);color:var(--on-sea);border:0;box-shadow:0 4px 16px rgba(30,41,59,.2);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .25s,transform .25s}
#toTop.show{opacity:1;transform:none;pointer-events:auto}

/* quick-jump sheet */
.sheet{position:fixed;inset:0;z-index:30;display:none}
.sheet.open{display:block}
.sheet .back{position:absolute;inset:0;background:rgba(30,41,59,.4);opacity:0;transition:opacity .25s}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:48vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 14px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(30,41,59,.18);transform:translateY(100%);transition:transform .28s ease}
.sheet.show .back{opacity:1}
.sheet.show .panel{transform:none}
.jhead{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 6px}
.jhead b{font-size:15px;font-weight:600}
.jclose{border:0;background:var(--paper);color:var(--sub);width:30px;height:30px;border-radius:50%;font-size:13px;cursor:pointer;box-shadow:var(--shadow)}
.jrow{display:flex;align-items:center;gap:10px;width:100%;margin:5px 0;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.jrow[aria-current="true"]{background:var(--sea-soft);border-color:var(--sea)}
.jd{min-width:48px;font-weight:600;font-size:14px}
.jn{flex:1;font-size:14px}
.jp{font-size:11px;color:var(--sub)}

.reset{display:block;margin:22px auto 0;border:0;background:none;color:var(--sub);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>

  +'<div class="dinfo"><b>預約資訊</b>預約人：Molly Jheng；人數：9 人</div>'
  +'<div class="warn" style="margin:0"><b>⚠️ 提醒</b>18:15 必須到齊才可入座。餐廳規定遲到超過 15 分鐘會被自動取消。用餐限時 120 分鐘。</div>'

  +PL.map(function(p){return '<div class="plan"><div class="plan-h"><div class="pn">'+p.e+' '+esc(p.n)+'</div><div class="pp">'+p.p+' 日圓</div><div class="pf">'+esc(p.f)+'</div></div>'+p.r.map(function(r){return '<div class="prow"><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>'}).join("")+'</div>'}).join("")
  +'</div></details>';
}
var KEY="naha-marathon-checks",S={},cur=0;
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){S={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var tabs=document.getElementById("tabs"),main=document.getElementById("main");
function K(i){/* 編號：非日期分頁 t0,t1…；日期分頁 0,1…（各自分開計算，新增分頁不會讓其他分頁錯位） */
  var f=!!D[i].free,n=0;for(var k=0;k<i;k++)if(!!D[k].free===f)n++;
  return (f?"t":"")+n;
}
function IK(i,j){return D[i].items[j].key||(K(i)+"-"+j)}
function dayCount(i){var n=0;D[i].items.forEach(function(_,j){if(S[IK(i,j)])n++});return n}
function dayTotals(i){
  var t=0,c=0;
  D[i].items.forEach(function(it,j){
    var id=IK(i,j);t++;if(S[id])c++;
  });
  return [c,t];
}
function dayDone(i){var r=dayTotals(i);return r[1]>0&&r[0]===r[1]}
function markTabs(){
  Array.prototype.forEach.call(tabs.querySelectorAll("button"),function(b){
    var i=+b.dataset.i,ok=dayDone(i);
    b.classList.toggle("done",ok);
    b.setAttribute("aria-label",D[i].d+" "+D[i].n+(ok?"（已完成）":""));
  });
}
/* 頂部進度：依手機目前日期自動切換（尚未出發／旅遊中／已結束）。要改旅行日期只改下面一行 */
var TRIP={s:[2026,12,4],e:[2026,12,11]};
function progress(){
  var now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),
      s=new Date(TRIP.s[0],TRIP.s[1]-1,TRIP.s[2]),e=new Date(TRIP.e[0],TRIP.e[1]-1,TRIP.e[2]),
      DAY=86400000,total=Math.round((e-s)/DAY)+1,txt,pct;
  if(t0<s){
    txt="📅 倒數 "+Math.round((s-t0)/DAY)+" 天，旅程即將開始！";pct=0;
  }else if(t0<=e){
    var day=Math.round((t0-s)/DAY)+1;
    txt="🧳 旅行中・Day "+day+"（第 "+day+" 天 / 共 "+total+" 天）";pct=day/total*100;
  }else{
    txt="🏠 旅程圓滿結束，回到溫暖的家（已結束 "+Math.round((t0-e)/DAY)+" 天）";pct=100;
  }
  document.getElementById("ptxt").textContent=txt;
  document.getElementById("pbar").style.width=pct+"%";
}
function renderTabs(){
  tabs.innerHTML=D.map(function(d,i){
    return '<button role="tab" aria-selected="'+(i===cur)+'" data-i="'+i+'"><b>'+d.d+'</b>'+d.n+'<i class="ck" aria-hidden="true">✅</i></button>'}).join("");
}
function render(){
  var d=D[cur];
  main.innerHTML='<section class="day"><h2>'+(d.free?esc(d.title):esc(d.d)+' ('+d.w+') '+esc(d.n))+'</h2><p class="theme">'+esc(d.s)+'</p>'
  +'<span class="done" id="dn"></span>'+(d.note?'<div class="note">'+esc(d.note)+'</div>':'')
  +'<ul>'+d.items.map(function(it,j){
    var id=IK(cur,j),on=!!S[id];
    return '<li class="'+(on?"on":"")+(it.c?" has-sub":"")+'"><label><input type="checkbox" data-id="'+id+'"'+(on?" checked":"")+'><span class="txt">'+(it.t?'<span class="time">'+esc(it.t)+'</span>':'')+'<div class="ttl">'+esc(it.h)+'</div>'
    +(it.x?'<div class="dsc">'+esc(it.x)+'</div>':'')+(it.o?it.o.map(function(o){return '<div class="opt"><b>'+esc(o[0])+'</b>'+esc(o[1])+'</div>'}).join(""):"")+(it.tip?'<div class="tip">💡'+esc(it.tip)+'</div>':'')+((it.m||it.l)?'<div class="lks">'+(it.m||[]).map(function(k){return [k[0],k[1],"map"]}).concat(it.l||[]).map(function(k){return '<a href="'+k[1]+'" target="_blank" rel="noopener">'+lkIco(k)+' '+esc(k[0])+'</a>'}).join("")+'</div>':'')
    +(it.warn?'<div class="warn"><b>'+esc(it.warn[0])+'</b>'+esc(it.warn[1])+'</div>':'')
    +'</span></label>'+(it.det?detHtml():'')+(it.c?subHtml(id,it):'')+'</li>'}).join("")+'</ul></section>';
  upd();
}
function upd(){
  var e=document.getElementById("dn");
  if(e){var r=dayTotals(cur);e.textContent="已經完成 "+r[0]+" / "+r[1]}
  progress();markTabs();
}
function lkIco(k){
  var t=k[2]||(/maps\.app\.goo\.gl|goo\.gl\/maps|google\.[a-z.]+\/maps|maps\.google/.test(k[1])?"map":"link");
  return t==="map"?"📍":"🔗";
}
function subHtml(id,it){
  var n=0,rows=it.c.map(function(x,k){var sid=id+"-s"+k,on=!!S[sid];if(on)n++;
    return '<label class="sl'+(on?" on":"")+'"><input type="checkbox" data-sid="'+sid+'"'+(on?" checked":"")+'><span>'+esc(x)+'</span></label>'}).join("");
  return '<details class="sub" open data-n="'+it.c.length+'"><summary class="subh">'+esc(it.ch||"購物清單")+' <b>'+n+' / '+it.c.length+'</b></summary><div class="sbody">'+rows+'</div></details>';
}
main.addEventListener("change",function(e){
  var c=e.target;if(!c.dataset||!c.dataset.sid)return;
  if(c.checked)S[c.dataset.sid]=1;else delete S[c.dataset.sid];
  c.closest(".sl").classList.toggle("on",c.checked);
  var box=c.closest(".sub");box.querySelector(".subh b").textContent=box.querySelectorAll("input:checked").length+" / "+box.dataset.n;
  save();upd();
});
function goTab(i){
  cur=i;renderTabs();render();
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});
  var a=tabs.querySelector('[aria-selected="true"]');
  if(a)tabs.scrollLeft=a.offsetLeft-(tabs.clientWidth-a.offsetWidth)/2;
}
tabs.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  goTab(+b.dataset.i);
});
/* 快速跳轉抽屜 */
var sheet=document.getElementById("sheet"),jump=document.getElementById("jump"),jlist=document.getElementById("jlist"),jt;
function openSheet(){
  jlist.innerHTML=D.map(function(d,i){
    var r=dayTotals(i),done=dayDone(i);
    return '<button type="button" class="jrow" data-i="'+i+'"'+(i===cur?' aria-current="true"':'')+'><span class="jd">'+d.d+'</span><span class="jn">'+esc(d.n)+'</span><span class="jp">'+(done?'✅':r[0]+' / '+r[1])+'</span></button>';
  }).join("");
  clearTimeout(jt);sheet.classList.add("open");
  requestAnimationFrame(function(){sheet.classList.add("show")});
  document.documentElement.style.overflow="hidden";
  jump.setAttribute("aria-expanded","true");
  var c=jlist.querySelector('[aria-current="true"]');if(c){c.focus({preventScroll:true});c.scrollIntoView({block:"center"})}
}
function closeSheet(){
  sheet.classList.remove("show");
  clearTimeout(jt);jt=setTimeout(function(){sheet.classList.remove("open")},280);
  document.documentElement.style.overflow="";
  jump.setAttribute("aria-expanded","false");
}
jump.addEventListener("click",openSheet);
document.getElementById("sheetBack").addEventListener("click",closeSheet);
document.getElementById("sheetClose").addEventListener("click",closeSheet);
jlist.addEventListener("click",function(e){
  var b=e.target.closest(".jrow");if(!b)return;
  closeSheet();goTab(+b.dataset.i);jump.focus({preventScroll:true});
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&sheet.classList.contains("open"))closeSheet()});
main.addEventListener("change",function(e){
  var c=e.target;if(!c.dataset||!c.dataset.id)return;
  if(c.checked)S[c.dataset.id]=1;else delete S[c.dataset.id];
  c.closest("li").classList.toggle("on",c.checked);save();upd();
});
document.getElementById("reset").addEventListener("click",function(){
  if(!confirm("確定清除所有勾選紀錄？"))return;
  S={};save();render();
});
/* 自動定位今天：日期落在行程內就直接開啟那一天（僅限 2026 年），否則維持預設頁籤 */
(function(){
  var n=new Date();if(n.getFullYear()!==2026)return;
  D.forEach(function(d,i){var m=/^(\d+)\/(\d+)$/.exec(d.d);
    if(m&&+m[1]===n.getMonth()+1&&+m[2]===n.getDate())cur=i});
})();
document.addEventListener("visibilitychange",function(){if(!document.hidden)progress()});
renderTabs();render();
(function(){var a=tabs.querySelector('[aria-selected="true"]');if(a)tabs.scrollLeft=a.offsetLeft-(tabs.clientWidth-a.offsetWidth)/2})();
/* 回到頂部按鈕：往下捲超過 300px 才出現 */
var topBtn=document.getElementById("toTop");
function onScroll(){topBtn.classList.toggle("show",(window.pageYOffset||document.documentElement.scrollTop)>300)}
window.addEventListener("scroll",onScroll,{passive:true});onScroll();
topBtn.addEventListener("click",function(){
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});
});
</script>
