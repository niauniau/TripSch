<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🌺 旅遊手冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#fff;--surface:#f3fafd;--line:#d6ebf5;--ink:#0b2f4a;--sub:#4f7388;
  --sea:#0a73b8;--lagoon:#32b5d8;--sea-soft:#e1f3fb;--on-sea:#fff;
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;--bg:#07202f;--surface:#0c2d42;--line:#17435e;--ink:#e8f5fc;--sub:#92b8cc;--sea:#4db4ea;--lagoon:#5fd0ea;--sea-soft:#10405c;--on-sea:#04202f}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
.wrap{max-width:520px;margin:0 auto;padding-bottom:40px}
header{padding:36px 22px 26px;background:linear-gradient(170deg,var(--sea) 0%,var(--lagoon) 100%);color:#fff}
header h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.02em}
header p{margin:4px 0 0;font-size:14px;opacity:.92}
svg.wave{display:block;width:100%;height:22px;margin-top:-1px;color:var(--bg)}
h2{margin:22px 20px 4px;font-size:15px;color:var(--sub);font-weight:500}
.list{display:grid;gap:12px;padding:10px 16px 0}
.card{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
.card:active{transform:scale(.98)}
.card:hover{border-color:var(--lagoon)}
.card:focus-visible{outline:2px solid var(--lagoon);outline-offset:2px}
.ico{flex:0 0 52px;height:52px;border-radius:16px;background:var(--sea-soft);display:grid;place-content:center;font-size:26px}
.info{min-width:0;flex:1}
.ttl{font-weight:700;font-size:16px}
.meta{font-size:13px;color:var(--sub);margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tag{display:inline-block;padding:1px 10px;border-radius:99px;background:var(--sea-soft);color:var(--sea);font-size:12px;font-weight:500}
button.card{width:100%;margin:0;font:inherit;text-align:left;cursor:pointer;-webkit-appearance:none;appearance:none}
.locked .go{font-size:13px;opacity:.55}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.go{color:var(--sea);font-size:20px}
.empty{padding:24px 20px;color:var(--sub);font-size:14px;text-align:center}
footer{margin-top:28px;text-align:center;font-size:12px;color:var(--sub)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🌺 旅遊手冊</h1>
  <p>歷史行程的紀錄</p>
</header>
<svg class="wave" viewBox="0 0 520 22" preserveAspectRatio="none" aria-hidden="true"><path d="M0 22V10C60 0 110 0 170 8s120 12 180 3 110-9 170 0v11z" fill="currentColor"/></svg>

<main id="app"></main>
<noscript><p class="empty">個人旅行紀錄</p></noscript>

<footer style="text-align: center; font-size: 12px; color: #999; margin-top: 60px; padding-bottom: 20px;">
  <p>© 2026-PRESENT Niauniau. All rights reserved.</p>
</footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>


/* 之後新增旅遊行程，只要在這個清單加一筆即可。
   group：分區標題（同一個 group 會排在一起）
   icon：圖示  title：行程名稱  meta：日期／地點  tag：小標籤（可省略；多個標籤用陣列，例如 tag:["路跑","朋友"]）
   href：行程網頁檔名（不填＝未公開，點下去會跳出「未公開」，可用 msg:"自訂文字" 改訊息）（放在同一個資料夾）  */


var TRIPS=[
  {group:"✈️ 2026",icon:"🏃🏻‍♀️",title:"2026那霸馬拉松行程",meta:"12/4 – 12/8・那霸馬拉松團體活動日",tag:["路跑","朋友"],href:"2026NAHAGroup.html"}
  ,{group:"✈️ 2026",icon:"🎶",title:"2026首爾NOL FESTIVAL行程",meta:"10/16 – 10/19",tag:["追星","朋友"]}
,{group:"✈️ 2025",icon:"🏃🏻‍♀️",title:"名古屋馬拉松行程",meta:"3/6 – 3/11",tag:"路跑"}
];

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var toast=document.getElementById("toast"),tt;
document.getElementById("app").addEventListener("click",function(e){
  var b=e.target.closest(".locked");if(!b)return;
  toast.textContent="🔒 "+b.dataset.msg;toast.classList.add("show");
  clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove("show")},1800);
});
var app=document.getElementById("app"),groups=[],map={};
TRIPS.forEach(function(t){var g=t.group||"行程";if(!map[g]){map[g]=[];groups.push(g)}map[g].push(t)});
app.innerHTML=groups.length?groups.map(function(g){
  return '<h2>'+esc(g)+'</h2><div class="list">'+map[g].map(function(t){
    return '<'+(t.href?'a class="card" href="'+esc(t.href)+'"':'button type="button" class="card locked" data-msg="'+esc(t.msg||"未公開")+'"')+'><span class="ico">'+esc(t.icon||"🧳")+'</span><span class="info"><div class="ttl">'+esc(t.title)+'</div><div class="meta">'+esc(t.meta)+'</div>'+(t.tag?'<div class="tags">'+[].concat(t.tag).map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join("")+'</div>':'')+'</span><span class="go" aria-hidden="true">'+(t.href?'›':'')+'</span></'+(t.href?'a':'button')+'>'}).join("")+'</div>'}).join(""):'<p class="empty">目前還沒有行程</p>';
</script>
</body>
</html>
