<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- 禁止搜尋引擎索引 -->
<meta name="robots" content="noindex, nofollow">

<title>🧳旅遊紀錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#FAF8F5;--paper:#FFFFFF;--ink:#1E293B;--sub:#64748B;--line:#E6EAEF;--line2:#D3DBE3;
  --sea:#4F7F97;--sea-soft:#EAF2F6;--on-sea:#FFFFFF;--hd1:#4F7F97;--hd2:#7BA9BD;
  --sand:#F1E8DC;--sand-ink:#8A6D49;--tip-bg:#F7F3EC;--tip-line:#EDE4D6;
  --shadow:0 1px 2px rgba(30,41,59,.05),0 4px 14px rgba(30,41,59,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#0F1A22;--paper:#16242E;--ink:#E5EDF3;--sub:#9AAFBD;--line:#24394A;--line2:#2F4658;
    --sea:#7FB0C8;--sea-soft:#1A3342;--on-sea:#0F1A22;--hd1:#24506A;--hd2:#3C6E86;
    --sand:#2D2A24;--sand-ink:#D8BE98;--tip-bg:#1D2A33;--tip-line:#2A3B47;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding-bottom:40px}

/* header */
header{padding:32px 22px 22px;background:linear-gradient(165deg,var(--hd1) 0%,var(--hd2) 100%);color:#fff}
header h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.04em}
header p{margin:4px 0 0;font-size:13.5px;opacity:.9;letter-spacing:.02em}
svg.wave{display:block;width:100%;height:22px;margin-top:-1px;color:var(--bg)}

h2{margin:24px 20px 8px;font-size:14px;color:var(--sub);font-weight:600;letter-spacing:.03em}
.list{display:grid;gap:12px;padding:0 16px}

/* cards */
.card{display:flex;align-items:center;gap:14px;padding:15px 16px;border:1px solid var(--line);border-radius:16px;background:var(--paper);color:inherit;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s,border-color .15s,box-shadow .15s}
.card:active{transform:scale(.98)}
.card:hover{border-color:var(--sea);box-shadow:0 4px 16px rgba(79,127,151,.12)}
.card:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.ico{flex:0 0 48px;height:48px;border-radius:14px;background:var(--sea-soft);display:grid;place-content:center;font-size:24px}
.info{min-width:0;flex:1}
.ttl{font-weight:600;font-size:15.5px}
.meta{font-size:13px;color:var(--sub);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--sand);color:var(--sand-ink);font-size:11.5px;font-weight:500}

button.card{width:100%;margin:0;font:inherit;text-align:left;cursor:pointer;-webkit-appearance:none;appearance:none}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.go{color:var(--sea);font-size:18px;font-weight:500}
.empty{padding:24px 20px;color:var(--sub);font-size:14px;text-align:center}
footer{margin-top:36px;text-align:center;font-size:12px;color:var(--sub)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🧳 旅遊紀錄</h1>
  <p>旅行的足跡</p>
</header>
<svg class="wave" viewBox="0 0 520 22" preserveAspectRatio="none" aria-hidden="true"><path d="M0 22V10C60 0 110 0 170 8s120 12 180 3 110-9 170 0v11z" fill="currentColor"/></svg>

<main id="app"></main>
<noscript><p class="empty">個人旅行紀錄</p></noscript>

<footer>
  <p>© 2026-PRESENT Niauniau. All rights reserved.</p>
</footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
var TRIPS=[
{group:"✈️ 2026",icon:"🏃🏻‍♀️",title:"那霸 2026 NAHA MARATHON",meta:"12/4 – 12/8",tag:["路跑","朋朋","SoloExtension"],href:"2026NAHAGroup.html"}
,{group:"✈️ 2026",icon:"🎶",title:"首爾 2026 NOL FESTIVAL",meta:"10/16 – 10/19",tag:["追星","朋朋"]}  
,{group:"✈️ 2026",icon:"🎶",title:"首爾 2026 ATA FESTIVAL",meta:"9/18 - 9/22",tag:["追星","Solo"]}
,{group:"✈️ 2026",icon:"🇯🇵",title:"名古屋中部新穗高",meta:"2/27 - 3/3",tag:["朋朋"]}

,{group:"✈️ 2025",icon:"🇯🇵",title:"成田東京賞楓",meta:"12/6 - 12/8",tag:["朋朋","BD"]}
,{group:"✈️ 2025",icon:"🇯🇵",title:"岡山大阪萬博",meta:"9/27 -10/1",tag:"朋朋"}
,{group:"✈️ 2025",icon:"🏃🏻‍♀️",title:"名古屋 2025 NAGOYA WOMEN'S MARATHON",meta:"3/6 – 3/11",tag:["路跑","朋朋"]}

,{group:"✈️ 2024",icon:"🇰🇷",title:"大邱釜山賞楓",meta:"11/2 - 11/6",tag:["賞楓","Solo","BD"]}
,{group:"✈️ 2024",icon:"🇯🇵",title:"東京母親節",meta:"5/11 - 5/16",tag:"家人"}
,{group:"✈️ 2024",icon:"🇯🇵",title:"九州熊本",meta:"1/20 - 1/26",tag:"朋朋"}

,{group:"✈️ 2023",icon:"🇯🇵",title:"神奈川橫濱",meta:"10/19 - 10/28",tag:["初次","Solo","BD"]}
];

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var toast=document.getElementById("toast"),tt;
document.getElementById("app").addEventListener("click",function(e){
  var b=e.target.closest(".locked");if(!b)return;
  toast.textContent="🔒 "+b.dataset.msg;toast.classList.add("show");
  clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove("show")},1800);
});
var app=document.getElementById("app"),groups=[],map={};
TRIPS.forEach(function(t){var g=t.group||"行程";if(!map[g]){map[g]=[];groups.push(g)}map[g].push(t)});
app.innerHTML=groups.length?groups.map(function(g){
  return '<h2>'+esc(g)+'</h2><div class="list">'+map[g].map(function(t){
    return '<'+(t.href?'a class="card" href="'+esc(t.href)+'" target="_blank" rel="noopener"'
:'button type="button" class="card locked" data-msg="'+esc(t.msg||"未公開")+'"')+'><span class="ico">'+esc(t.icon||"🧳")+'</span><span class="info"><div class="ttl">'+esc(t.title)+'</div><div class="meta">'+esc(t.meta)+'</div>'+(t.tag?'<div class="tags">'+[].concat(t.tag).map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join("")+'</div>':'')+'</span><span class="go" aria-hidden="true">'+(t.href?'›':'')+'</span></'+(t.href?'a':'button')+'>'}).join("")+'</div>'}).join(""):'<p class="empty">目前還沒有行程</p>';
</script>
</body>
</html>
