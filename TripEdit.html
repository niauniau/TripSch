  +PL.map(function(p){return '<div class="plan"><div class="plan-h"><div class="pn">'+p.e+' '+esc(p.n)+'</div><div class="pp">'+p.p+' 日圓</div><div class="pf">'+esc(p.f)+'</div></div>'+p.r.map(function(r){return '<div class="prow"><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>'}).join("")+'</div>'}).join("")
  +'</div></details>';

var KEY="naha-marathon-checks",S={},cur=0;
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){S={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var tabs=document.getElementById("tabs"),main=document.getElementById("main");
function K(i){return i===0?"f":String(i-1)}
function dayCount(i){var n=0;D[i].items.forEach(function(_,j){if(S[K(i)+"-"+j])n++});return n}
function progress(){
  var t=0,c=0;D.forEach(function(d,i){if(d.free)return;t+=d.items.length;c+=dayCount(i)});
  document.getElementById("ptxt").textContent="旅程進度 "+c+" / "+t;
  document.getElementById("pbar").style.width=(t?c/t*100:0)+"%";
}
function renderTabs(){
  tabs.innerHTML=D.map(function(d,i){
    return '<button role="tab" aria-selected="'+(i===cur)+'" data-i="'+i+'"><b>'+d.d+'</b>'+d.n+'</button>'}).join("");
}
function render(){
  var d=D[cur];
  main.innerHTML='<section class="day"><h2>'+(d.free?esc(d.title):esc(d.d)+' ('+d.w+') '+esc(d.n))+'</h2><p class="theme">'+esc(d.s)+'</p>'
  +'<span class="done" id="dn"></span>'+(d.note?'<div class="note">'+esc(d.note)+'</div>':'')
  +'<ul>'+d.items.map(function(it,j){
    var id=K(cur)+"-"+j,on=!!S[id];
    return '<li class="'+(on?"on":"")+(it.c?" has-sub":"")+'"><label><input type="checkbox" data-id="'+id+'"'+(on?" checked":"")+'><span class="txt">'+(it.t?'<span class="time">'+esc(it.t)+'</span>':'')+'<div class="ttl">'+esc(it.h)+'</div>'
    +(it.x?'<div class="dsc">'+esc(it.x)+'</div>':'')+(it.o?it.o.map(function(o){return '<div class="opt"><b>'+esc(o[0])+'</b>'+esc(o[1])+'</div>'}).join(""):"")+(it.tip?'<div class="tip">💡 時機：'+esc(it.tip)+'</div>':'')+((it.m||it.l)?'<div class="lks">'+(it.m||[]).map(function(k){return [k[0],k[1],"map"]}).concat(it.l||[]).map(function(k){return '<a href="'+k[1]+'" target="_blank" rel="noopener">'+lkIco(k)+' '+esc(k[0])+'</a>'}).join("")+'</div>':'')
    +(it.warn?'<div class="warn"><b>'+esc(it.warn[0])+'</b>'+esc(it.warn[1])+'</div>':'')
    +'</span></label>'+(it.det?detHtml():'')+(it.c?subHtml(id,it):'')+'</li>'}).join("")+'</ul></section>';
  upd();
}
function upd(){
  var e=document.getElementById("dn");
  if(e)e.textContent="今日完成 "+dayCount(cur)+" / "+D[cur].items.length;
  progress();
}
function lkIco(k){
  var t=k[2]||(/maps\.app\.goo\.gl|goo\.gl\/maps|google\.[a-z.]+\/maps|maps\.google/.test(k[1])?"map":"link");
  return t==="map"?"📍":"🔗";
}
function subHtml(id,it){
  var n=0,rows=it.c.map(function(x,k){var sid=id+"-s"+k,on=!!S[sid];if(on)n++;
    return '<label class="sl'+(on?" on":"")+'"><input type="checkbox" data-sid="'+sid+'"'+(on?" checked":"")+'><span>'+esc(x)+'</span></label>'}).join("");
  return '<details class="sub" open data-n="'+it.c.length+'"><summary class="subh">'+esc(it.ch||"購物清單")+' <b>'+n+' / '+it.c.length+'</b></summary><div class="sbody">'+rows+'</div></details>';
}
main.addEventListener("change",function(e){
  var c=e.target;if(!c.dataset||!c.dataset.sid)return;
  if(c.checked)S[c.dataset.sid]=1;else delete S[c.dataset.sid];
  c.closest(".sl").classList.toggle("on",c.checked);
  var box=c.closest(".sub");box.querySelector(".subh b").textContent=box.querySelectorAll("input:checked").length+" / "+box.dataset.n;
  save();
});
tabs.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  cur=+b.dataset.i;renderTabs();render();window.scrollTo({top:0});
  var a=tabs.querySelector('[aria-selected="true"]');if(a&&a.scrollIntoView)a.scrollIntoView({inline:"center",block:"nearest"});
});
main.addEventListener("change",function(e){
  var c=e.target;if(!c.dataset||!c.dataset.id)return;
  if(c.checked)S[c.dataset.id]=1;else delete S[c.dataset.id];
  c.closest("li").classList.toggle("on",c.checked);save();upd();
});
document.getElementById("reset").addEventListener("click",function(){
  if(!confirm("確定清除所有勾選紀錄？"))return;
